[package]
name = "relay-pool-desktop"
version = "0.4.5"
description = "Local desktop AI relay pool manager"
authors = ["Relay Pool Desktop contributors"]
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "relay_pool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop-runtime", "tray"]
desktop-runtime = [
    "tauri/wry",
    "tauri/compression",
    "tauri/common-controls-v6",
    "tauri/dynamic-acl",
    "tauri/x11",
    "tauri/dbus",
]
tray = ["desktop-runtime", "tauri/tray-icon"]
# Test executables are not bundled with the production Windows manifest. Do
# not enable `common-controls-v6` here: that feature makes the test binary
# import `TaskDialogIndirect`, which the legacy comctl32 loader rejects before
# the test process can start. The production desktop feature keeps v6 because
# the packaged application receives the matching activation context.
tauri-test = ["tauri/test", "tauri/wry"]
# Enables loopback tests that exercise the complete runtime-log service. These
# tests are excluded from legacy integration harnesses that include individual
# owner modules without the application observability graph.
runtime-logging-artifact = []
# Debug-only packaged smoke seam. The corresponding path/exit hooks are also
# gated by `debug_assertions`, so enabling this feature in a release build
# cannot redirect application data or force an automatic exit.
runtime-logging-windows-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "json", "socks"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
httparse = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "rng"] }
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", default-features = false, features = [] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "request-id"] }
url = "2"
zeroize = "1"
age = "=0.12.1"
hmac = "=0.13.0"

[dev-dependencies]
static_assertions = "=1.1.0"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
